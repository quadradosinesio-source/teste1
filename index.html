<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = {
    x: 100,
    y: canvas.height - 120,
    width: 50,
    height: 70,
    color: "blue",
    velocityY: 0,
    jumping: false
};

let gravity = 0.75;
let obstacles = [];
let score = 0;
let speed = 4; // mais lento
let gameRunning = true;

// controle de espaçamento
let obstacleTimer = 0;
let nextObstacle = 120; // frames até próximo obstáculo

function createObstacle() {
    let height = 50 + Math.random() * 50;

    obstacles.push({
        x: canvas.width,
        y: canvas.height - height - 50,
        width: 40,
        height: height,
        color: "red"
    });

    // novo tempo aleatório entre obstáculos
    nextObstacle = 110 + Math.random() * 90;
    obstacleTimer = 0;
}

function drawPlayer() {
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    ctx.beginPath();
    ctx.arc(player.x + 25, player.y - 15, 15, 0, Math.PI * 2);
    ctx.fillStyle = "#f1c27d";
    ctx.fill();
}

function drawGround() {
    ctx.fillStyle = "#8B4513";
    ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
}

function updatePlayer() {
    player.y += player.velocityY;
    player.velocityY += gravity;

    if(player.y >= canvas.height - 120) {
        player.y = canvas.height - 120;
        player.jumping = false;
        player.velocityY = 0;
    }
}

function drawObstacles() {
    for(let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= speed;

        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        // colisão
        if(
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ) {
            endGame();
        }

        if(obs.x + obs.width < 0) {
            obstacles.splice(i,1);
            score++;
            document.getElementById("info").innerText = "Pontos: " + score;
        }
    }
}

function jump() {
    if(!player.jumping) {
        player.velocityY = -14;
        player.jumping = true;
    }
}

function endGame() {
    gameRunning = false;
    document.getElementById("gameOver").style.display = "block";
    document.getElementById("restart").style.display = "block";
}

function restartGame() {
    obstacles = [];
    score = 0;
    speed = 4;
    obstacleTimer = 0;
    nextObstacle = 120;
    gameRunning = true;

    player.y = canvas.height - 120;
    player.velocityY = 0;
    player.jumping = false;

    document.getElementById("info").innerText = "Pontos: 0";
    document.getElementById("gameOver").style.display = "none";
    document.getElementById("restart").style.display = "none";

    gameLoop();
}

function gameLoop() {
    if(!gameRunning) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGround();
    drawPlayer();
    updatePlayer();
    drawObstacles();

    obstacleTimer++;
    if(obstacleTimer >= nextObstacle) {
        createObstacle();
    }

    // velocidade sobe lentamente
    speed = 4 + (score * 0.15);

    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", e => {
    if(e.code === "Space" || e.code === "ArrowUp") jump();
});

document.addEventListener("click", jump);

document.getElementById("restart").addEventListener("click", restartGame);

gameLoop();
</script>
