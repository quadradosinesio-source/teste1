<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrida do Personagem</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(to top, #87CEEB, #ffffff);
        overflow: hidden;
    }

    canvas {
        display: block;
        background: #6ab04c;
    }

    #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000;
    }

    #gameOver {
        position: absolute;
        top: 40%;
        width: 100%;
        text-align: center;
        font-size: 42px;
        color: red;
        font-weight: bold;
        display: none;
        text-shadow: 2px 2px 5px black;
    }

    #restart {
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 25px;
        font-size: 20px;
        border: none;
        background: orange;
        color: white;
        cursor: pointer;
        display: none;
        border-radius: 8px;
    }

    #restart:hover {
        background: darkorange;
    }
</style>
</head>
<body>

<div id="info">Pontos: 0</div>
<div id="gameOver">GAME OVER</div>
<button id="restart">Recomeçar</button>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = {
    x: 100,
    y: canvas.height - 120,
    width: 50,
    height: 70,
    color: "blue",
    velocityY: 0,
    jumping: false
};

let gravity = 0.8;
let obstacles = [];
let score = 0;
let speed = 6;
let gameRunning = true;

function createObstacle() {
    let height = 50 + Math.random() * 50;
    obstacles.push({
        x: canvas.width,
        y: canvas.height - height - 50,
        width: 40,
        height: height,
        color: "red"
    });
}

function drawPlayer() {
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Cabeça
    ctx.beginPath();
    ctx.arc(player.x + 25, player.y - 15, 15, 0, Math.PI * 2);
    ctx.fillStyle = "#f1c27d";
    ctx.fill();
}

function drawGround() {
    ctx.fillStyle = "#8B4513";
    ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
}

function updatePlayer() {
    player.y += player.velocityY;
    player.velocityY += gravity;

    if(player.y >= canvas.height - 120) {
        player.y = canvas.height - 120;
        player.jumping = false;
    }
}

function drawObstacles() {
    for(let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.x -= speed;
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        // colisão
        if(
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ) {
            endGame();
        }

        if(obs.x + obs.width < 0) {
            obstacles.splice(i,1);
            score++;
            document.getElementById("info").innerText = "Pontos: " + score;
        }
    }
}

function jump() {
    if(!player.jumping) {
        player.velocityY = -15;
        player.jumping = true;
    }
}

function endGame() {
    gameRunning = false;
    document.getElementById("gameOver").style.display = "block";
    document.getElementById("restart").style.display = "block";
}

function restartGame() {
    obstacles = [];
    score = 0;
    speed = 6;
    gameRunning = true;
    player.y = canvas.height - 120;
    document.getElementById("info").innerText = "Pontos: 0";
    document.getElementById("gameOver").style.display = "none";
    document.getElementById("restart").style.display = "none";
    gameLoop();
}

function gameLoop() {
    if(!gameRunning) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGround();
    drawPlayer();
    updatePlayer();
    drawObstacles();

    if(Math.random() < 0.02) createObstacle();

    if(score > 0 && score % 5 === 0) speed = 6 + score / 5;

    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", e => {
    if(e.code === "Space" || e.code === "ArrowUp") jump();
});

document.addEventListener("click", jump);

document.getElementById("restart").addEventListener("click", restartGame);

gameLoop();
</script>

</body>
</html>
